schema @link(url: "https://specs.apollo.dev/federation/v2.11", import: ["@key"]) {
  query: Query
}

type Appointment @key(fields: "id") {
  id: ID!
  user: String!
  time: String!
  status: String!
}

type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
  appointment(id: ID!): Appointment!
}

scalar _Any

union _Entity = Appointment

type _Service {
  sdl: String!
}